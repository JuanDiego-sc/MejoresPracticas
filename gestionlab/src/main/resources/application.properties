spring.application.name=minicore


spring.datasource.url=jdbc:postgresql://localhost:5432/GestionLab
spring.datasource.username=postgres
spring.datasource.password=toor
spring.datasource.driver-class-name=org.postgresql.Driver


# Hibernate

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=TRACE

server.port=${PORT:5003}

# Keycloak OAuth2 Resource Server Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/Vet_auth_demo
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/Vet_auth_demo/protocol/openid-connect/certs